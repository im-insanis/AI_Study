name: Deploy Statistics Textbook

on:
  push:
    branches: [main]
    paths:
      - 'Statistics/textbook/**'
      - '.github/workflows/statistics-textbook-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: statistics-textbook-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Prepare site
        run: |
          rm -rf _site
          mkdir _site
          unzip -q Statistics/textbook/site.zip -d _site
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

# retriggered after GitHub Pages was enabled
